name: cpu-tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pyyaml numpy scipy
      - name: Run CI-safe test suite
        run: |
          pytest -q \
            tests/test_credit_math.py \
            tests/test_counterfactual_sequence.py \
            tests/test_credit_weights.py \
            tests/test_weight_shuffle.py \
            tests/test_temporal_schedule.py \
            tests/test_local_frame.py \
            tests/test_target_radius.py \
            tests/test_target_mask.py \
            tests/test_noop_target.py \
            tests/test_ema.py \
            tests/test_behavior_frozen.py \
            tests/test_onpolicy_config.py \
            tests/test_onpolicy_wiring.py \
            tests/test_gate_checks.py \
            tests/test_static_eval_rows.py \
            tests/test_cfd2_sampling.py \
            tests/test_cfd2_graph_conventions.py \
            tests/test_signed_local_scheduler.py \
            tests/test_signed_local_edge_orientation.py \
            tests/test_signed_local_mask.py \
            tests/test_signed_local_dataset_invariants.py \
            tests/test_ag_classification.py \
            tests/test_ag_no_floor.py \
            tests/test_ag_strict_consensus.py \
            tests/test_ag_region_weights.py \
            tests/test_ag_adaptive_weights.py \
            tests/test_ag_abstention.py \
            tests/test_ag_shuffle.py \
            tests/test_ag_weight_invariants.py \
            tests/test_ag_pilot_wiring.py \
            tests/test_diffonly_audit.py \
            tests/test_branch_schedule.py \
            tests/test_branch_state_shapes.py \
            tests/test_branch_decode.py \
            tests/test_branch_teacher_select.py \
            tests/test_branch_changed_positions.py \
            tests/test_branch_local_target.py \
            tests/test_branch_query_replay.py \
            tests/test_branch_local_loss.py \
            tests/test_branch_no_credit_dependency.py \
            tests/test_branch_online_dpo_weights.py \
            tests/test_branch_gate_logic.py \
            tests/test_online_pair_all_changed.py \
            tests/test_online_pair_no_geometry_dependency.py \
            tests/test_online_pair_bank.py \
            tests/test_online_query_accounting.py \
            tests/test_online_update_schedule.py \
            tests/test_online_pref_gates.py
