project: vhh_boltzgen_rl_round2_cdr_margin
seed: 777
boltzgen_root: ${BOLTZGEN_ROOT}
boltzgen_checkpoint: ${BOLTZGEN_CKPT}
scorer_root: ${VHH_SCORER_ROOT}
manifest: ${VHH_RL_DATA}
output_root: runs
device: cuda
precision: fp32
mode: scorer-overfit
max_cases: 0
debug_cases: []
sampling:
  temperature: "0.5"
  group_size: 8
reward:
  name: vhh_scorer
  direction: higher_is_better
  objective: cdr_margin_guarded
  guard_lambda: 5.0
  guard_floors_path: runs/round1_rl_split/guard_floors.json
advantage:
  type: rank
algorithm:
  name: grpo
  clip_eps: 0.20
  update_epochs: 2
  beta_kl: 0.01
optimizer:
  lr: 1.0e-5
training:
  cases_per_rollout_batch: 2
  max_updates: 100
  checkpoint_every: 10
evaluation:
  num_samples_per_case: 8
